quarkus.application.name=cdi-flow-quarkus-crud
quarkus.http.port=8091

# --- cdi-flow -------------------------------------------------------------------
# The whole configuration of the recorder. In dev-mode and in tests the extension records without
# any of this; a packaged application is asked explicitly, because instrumenting every bean of an
# application is not something a production build should do by accident.
cdi-flow.enabled=true
cdi-flow.output-directory=target/flow-diagrams
# A licence header in every generated diagram, as a Mermaid comment - which is not drawn. A build
# that insists on one (apache-rat, here) is then satisfied without an exclusion.
cdi-flow.file-header=Licensed under the Apache License, Version 2.0

# --- the Angular front-end, served from this same process -----------------------
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist/cdi-flow-crud/browser
quarkus.quinoa.package-manager=pnpm
# Lifecycle scripts stay off, and the offline flags keep the build working without a network.
quarkus.quinoa.package-manager-command.install=install --frozen-lockfile --ignore-scripts --offline
quarkus.quinoa.package-manager-command.ci=install --frozen-lockfile --ignore-scripts --offline
quarkus.quinoa.package-manager-command.build=run build
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
