# Both selectors at once.
#
# They form a union: a bean is recorded when its name matches the pattern OR when it carries one
# of the stereotypes. Everything under ...examples.order plus every @AuditedService anywhere else.
cdi-flow.include-pattern=org\\.os890\\.cdi\\.uml\\.dynamic\\.flow\\.renderer\\.examples\\.order\\..*
cdi-flow.include-stereotypes=org.os890.cdi.uml.dynamic.flow.renderer.examples.stereotypes.AuditedService
