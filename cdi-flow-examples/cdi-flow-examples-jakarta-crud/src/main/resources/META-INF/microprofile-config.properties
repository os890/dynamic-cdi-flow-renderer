# The whole cdi-flow configuration of this application - and neither line switches it on: a portable
# container runs the extension in the jar, which records unless told otherwise. The Quarkus example
# needs cdi-flow.enabled=true instead, because a production build there records nothing by default.
cdi-flow.output-directory=target/flow-diagrams
cdi-flow.file-header=Licensed under the Apache License, Version 2.0
