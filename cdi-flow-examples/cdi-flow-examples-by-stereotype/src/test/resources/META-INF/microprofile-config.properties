# Selecting the recorded beans by their CDI stereotype.
#
# No include-pattern here on purpose - the stereotype is meant to decide on its own. Beans reaching
# @AuditedService through another stereotype are selected as well.
cdi-flow.include-stereotypes=org.os890.cdi.uml.dynamic.flow.renderer.examples.stereotypes.AuditedService
